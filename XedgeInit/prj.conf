# Shared Xedge configuration. Hardware and simulator settings live in boards/.

# Enable Xedge module
CONFIG_XEDGE=y


# --- Sockets / contexts / FDs ---
# Each TCP connection consumes a net_context and a POSIX FD.
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
CONFIG_NET_SOCKETS_POLL_MAX=64

# --- Buffers (keep or increase from earlier tuning) ---
# Ensure pools don't starve when you scale connections.
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=128

# Bound each connection's window so concurrent IDE asset downloads share pools.
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=4096

# --- Debug aids (temporarily) ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y


# Networking - Essential for HTTP server
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_SNTP=y

# DNS resolver; each board selects static or DHCP-provided servers.
CONFIG_DNS_RESOLVER=y
# Helpful if some domains have big/long answers
CONFIG_DNS_RESOLVER_ADDITIONAL_BUF_CTR=3
CONFIG_DNS_NUM_CONCUR_QUERIES=3
# Process DNS replies before the Xedge TLS workers (base priority 5).
# The default socket-service priority can starve until DNS queries time out.
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=2

# Initialize the board's network interface before starting Xedge.
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y


# Threading and scheduling
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_NUM_COOP_PRIORITIES=16
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Memory management
CONFIG_HEAP_MEM_POOL_SIZE=61440
CONFIG_DYNAMIC_THREAD=y

# Console and shell
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096

# POSIX API (helps with BAS porting layer)
CONFIG_POSIX_API=y
CONFIG_ZVFS_OPEN_MAX=64

CONFIG_EVENTFD=y

# Entropy (required for network randomization)
CONFIG_ENTROPY_GENERATOR=y

# Disable assertions for cleaner output
#CONFIG_ASSERT=y
#CONFIG_ASSERT_LEVEL=0

# Increase various limits for BAS
CONFIG_MAIN_THREAD_PRIORITY=5

# GPIO (optional - for LED examples)
CONFIG_GPIO=y

# File system support
# Zephyr VFS + LittleFS; each board supplies its flash partition and mount.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
