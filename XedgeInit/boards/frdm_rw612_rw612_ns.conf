# FRDM-RW612: Ethernet and DHCP, with the TPM provided by secure TF-M firmware.
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_BUILD_WITH_TFM=y
# Let the TF-M dispatcher keep the calling thread scheduled until PSA returns.
# Interrupts remain enabled; a suspended secure crypto call must not be switched
# away from by the nonsecure scheduler on this platform.
CONFIG_ARM_NONSECURE_PREEMPTIBLE_SECURE_CALLS=n
CONFIG_TFM_PARTITION_CRYPTO=y
CONFIG_TFM_PARTITION_INTERNAL_TRUSTED_STORAGE=y
CONFIG_XEDGE_PSA=y
CONFIG_USE_DT_CODE_PARTITION=y

# Keep 70% of the 8 MiB PSRAM for Xedge, rounded down to 8 bytes.
# Zephyr's data, network pools, and all thread stacks stay in internal SRAM.
CONFIG_XEDGE_HEAP_SIZE=5872024
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MEM_ATTR=y
CONFIG_MEMC=y

# NXP's nonsecure PSRAM sample requires this flash-before-PSRAM init order.
CONFIG_MEMC_MCUX_FLEXSPI_INIT_PRIORITY=0
CONFIG_FLASH_INIT_PRIORITY=50
CONFIG_MEMC_INIT_PRIORITY=60
CONFIG_MEMC_MCUX_FLEXSPI_INIT_XIP=y
CONFIG_FLASH_LOG_LEVEL_OFF=y
CONFIG_MEMC_LOG_LEVEL_OFF=y
CONFIG_FS_LITTLEFS_CACHE_SIZE=256

# Keep assertions enabled for board bring-up.
CONFIG_ASSERT=y
