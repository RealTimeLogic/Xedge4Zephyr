# MIMXRT1060-EVKC: use the board's Ethernet PHY and DHCP on the local LAN.
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y

# Reserve 70% of this board's 32 MiB SDRAM for Xedge, rounded down to 8 bytes:
# floor((32 * 1024 * 1024 * 70 / 100) / 8) * 8 = 23488096 bytes (22.4 MiB).
# Zephyr stacks, network buffers, and other data use part of the remaining 30%.
CONFIG_XEDGE_HEAP_SIZE=23488096

# Match the overlay so the file-cache heap supports all configured open files.
CONFIG_FS_LITTLEFS_CACHE_SIZE=256

# Run directly from QSPI flash. Bound the image to its devicetree partition.
CONFIG_XIP=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Zephyr selects FLASH_MCUX_FLEXSPI_XIP and relocates the flash path to RAM.
CONFIG_FLASH_LOG_LEVEL_OFF=y
CONFIG_MEMC_LOG_LEVEL_OFF=y

# Use the MCU entropy driver; never enable the simulator test RNG here.
CONFIG_TEST_RANDOM_GENERATOR=n
