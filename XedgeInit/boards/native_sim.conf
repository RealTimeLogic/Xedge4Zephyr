# Board-specific configuration for native_sim
# This file is automatically included when building for native_sim

# Networking for native_sim
CONFIG_NET_NATIVE=y

# Preserve the existing TAP network and simulator test settings.
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.200.200.2"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="10.200.200.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.200.200.1"
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_NET_TCP_TIME_WAIT_DELAY=2000
CONFIG_TEST_RANDOM_GENERATOR=y

# Persistent simulated flash, also exposed through the host FUSE mount.
CONFIG_FLASH_SIMULATOR=y
CONFIG_FUSE_FS_ACCESS=y
