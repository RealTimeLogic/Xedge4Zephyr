# MIMXRT1020-EVK: wired Ethernet with DHCP-provided address and DNS servers.
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y

# Reserve 70% of 32 MiB SDRAM for Xedge, rounded down to 8 bytes.
CONFIG_XEDGE_HEAP_SIZE=23488096
# Leave room for initialization and SNTP calls on the main thread.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_TEST_RANDOM_GENERATOR=n

# Match the overlay's per-file cache size.
CONFIG_FS_LITTLEFS_CACHE_SIZE=256

# Boot directly from QSPI; keep writable files outside the firmware image.
CONFIG_XIP=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# The FlexSPI XIP driver runs flash operations from RAM.
CONFIG_FLASH_LOG_LEVEL_OFF=y
CONFIG_MEMC_LOG_LEVEL_OFF=y
