# STM32F746G-DISCO: Ethernet with DHCP-provided address and DNS servers.
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y

# ACME plus concurrent TLS connections exhausted the default 2 MiB heap.
# Reserve 70% of 8 MiB SDRAM, rounded down to an 8-byte boundary.
CONFIG_XEDGE_HEAP_SIZE=5872024
# Initialize external SDRAM before main() uses the Xedge heap.
# Kernel data and Ethernet DMA buffers stay in internal SRAM.
CONFIG_MEMC=y
CONFIG_TEST_RANDOM_GENERATOR=n
# Startup and SNTP used 1,928 bytes on hardware; retain room for call variation.
CONFIG_MAIN_STACK_SIZE=4096

# Keep the network pools within 256 KiB SRAM. Xedge allocations use SDRAM.
# Each direction retains 32 KiB of packet data and 4 KiB TCP windows.
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Match the overlay so the file-cache heap supports all configured open files.
CONFIG_FS_LITTLEFS_CACHE_SIZE=256

# Boot from internal flash; store the resource ZIP and LittleFS in QSPI.
CONFIG_XIP=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_XEDGE_RESOURCE_FLASH=y
# HEX/ELF represent the separate internal and external flash addresses.
# A flat binary would include the approximately 2 GiB address gap.
CONFIG_BUILD_OUTPUT_BIN=n
CONFIG_BUILD_OUTPUT_HEX=y
